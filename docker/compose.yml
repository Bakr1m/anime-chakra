services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    image: anime-chakra:local
    ports:
      - "8080:8080"
    profiles: ["serve", "https", "tunnel"]

  # LAN HTTPS: https://<lan-ip>:8443 (one-time cert warning, see README)
  https:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    profiles: ["https"]

  # Quick public URL for phones: prints https://*.trycloudflare.com
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://web:8080
    depends_on:
      - web
    profiles: ["tunnel"]

volumes:
  caddy-data:
