[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chakralens"
version = "1.0.0"
description = "Chakra Lens lab + desktop: gesture brain, dataset tooling, OpenCV renderer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "mediapipe>=0.10",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "qrcode>=7.4",
]

[project.optional-dependencies]
gui = ["opencv-python>=4.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "numpy", "scikit-learn"]

[project.scripts]
chakralens = "chakralens.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=chakralens --cov-report=term --cov-fail-under=0"
