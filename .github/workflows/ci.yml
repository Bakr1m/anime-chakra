name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test:coverage
        working-directory: web

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: system libs for headless OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e "./python[dev]"
      - run: python -m ruff check src tests
        working-directory: python
      - run: python -m mypy src
        working-directory: python
      - run: python -m pytest -q
        working-directory: python

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system libs for headless OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -e "./python[dev]"
      - run: npm ci
        working-directory: web
      - run: python3 scripts/parity.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            web/playwright-report/
            web/test-results/
            docs/img/demo-*.png

  docker:
    needs: [web, python, parity, e2e]
    # Publish only from pushes (main / v* tags) — unmerged PR code never
    # reaches the registries; PR runs build amd64 and smoke-test locally.
    # Dependabot runs receive no secrets (Docker Hub login would fail), so
    # they are skipped; fork PRs run checks only.
    if: github.actor != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { dockerfile: docker/web.Dockerfile, name: anime-chakra, smoke: web }
          - { dockerfile: docker/lab.Dockerfile, name: anime-chakra-lab, smoke: lab }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: github.event_name == 'push'
        id: meta
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (push events)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build for smoke test (PR runs)
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: local-smoke:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (web)
        if: matrix.image.smoke == 'web'
        run: |
          IMG=${{ github.event_name == 'push' && format('{0}/{1}:sha-{2}', secrets.DOCKERHUB_USERNAME, matrix.image.name, github.sha) || 'local-smoke:pr' }}
          docker run -d --rm -p 8080:8080 "$IMG"
          sleep 5
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
      - name: smoke test (lab)
        if: matrix.image.smoke == 'lab'
        run: |
          IMG=${{ github.event_name == 'push' && format('{0}/{1}:sha-{2}', secrets.DOCKERHUB_USERNAME, matrix.image.name, github.sha) || 'local-smoke:pr' }}
          docker run --rm "$IMG" --help
          docker run --rm "$IMG" evaluate --n-per-class 10

  pages:
    needs: [web, python, parity, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        id: deploy
